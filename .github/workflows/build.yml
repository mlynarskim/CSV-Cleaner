name: Build desktop applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build application
        run: pyinstaller --clean --noconfirm csv_cleaner_macos.spec

      - name: Create archive
        run: |
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "dist/CSV Cleaner.app" \
            "dist/CSV-Cleaner-macOS-${{ matrix.architecture }}.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: CSV-Cleaner-macOS-${{ matrix.architecture }}
          path: dist/CSV-Cleaner-macOS-${{ matrix.architecture }}.zip
          if-no-files-found: error

  build_windows:
    runs-on: windows-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Run tests
        run: python -m unittest discover -v

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm csv_cleaner_windows.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/CSV Cleaner.exe")) {
            throw "CSV Cleaner.exe was not created."
          }

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -LiteralPath "dist/CSV Cleaner.exe" -DestinationPath "dist/CSV-Cleaner-Windows-x64.zip" -Force

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: CSV-Cleaner-Windows-x64
          path: dist/CSV-Cleaner-Windows-x64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_macos, build_windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download applications
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
